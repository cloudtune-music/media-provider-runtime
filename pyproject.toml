[project]
name = "media-provider-runtime"
version = "0.1.0"
description = "Isolated worker runtime for Media Provider Server plugins"
readme = "README.md"

authors = [
    { name = "Yilei Bi" }
]

requires-python = ">=3.12"

license = "Apache-2.0"
license-files = ["LICENSE"]

dependencies = [
    "media-provider-sdk>=0.1.0,<0.2.0",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["src/media_provider_runtime"]


[tool.uv.sources]
media-provider-sdk = { git = "https://github.com/cloudtune-music/media-provider-sdk.git", tag = "v0.1.0" }